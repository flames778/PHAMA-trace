<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 210">
  <defs>
    <linearGradient id="markGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b44b2a" />
      <stop offset="100%" stop-color="#8c3319" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#8a3419" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean Transparent Canvas -->
  <g transform="translate(40, 36)">
    <!-- ICON / EMBLEM SQUIRCLE -->
    <rect x="0" y="0" width="208" height="208" rx="52" fill="url(#markGrad)" filter="url(#drop)" />
    <rect x="6" y="6" width="196" height="196" rx="46" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Concentric Integrity Aura -->
    <circle cx="104" cy="104" r="68" fill="none" stroke="#fff8f6" stroke-width="3" stroke-dasharray="6 5" stroke-opacity="0.35" />

    <!-- Apothecary & Clinical Integrity Cross -->
    <path d="M 88 52 
             C 88 47 92 43 97 43 
             L 111 43 
             C 116 43 120 47 120 52 
             L 120 88 
             C 120 90 90 90 122 90 
             L 156 90 
             C 161 90 165 94 165 99 
             L 165 109 
             C 165 114 161 118 156 118 
             L 122 118 
             L 120 156 
             C 120 161 116 165 111 165 
             L 97 165 
             C 92 165 88 161 88 156 
             L 88 118 
             L 52 118 
             C 47 118 43 114 43 109 
             L 43 99 
             C 43 94 47 90 52 90 
             L 88 90 
             Z" 
          fill="#fff8f6" />

    <!-- Center Point of Trust -->
    <circle cx="104" cy="104" r="10" fill="#b44b2a" />
    <circle cx="104" cy="104" r="5" fill="#fff8f6" />
    
    <!-- Warm Herbal / Purity Leaf Motif -->
    <path d="M 132 76 C 132 60 148 60 148 76 C 148 92 132 92 132 76 Z" fill="#d97757" opacity="0.95" />
  </g>

  <!-- LOGOTYPE & EDITORIAL LOCKUP -->
  <g transform="translate(290, 48)">
    <!-- Primary Brand Wordmark: Bricolage Grotesque display -->
    <text x="0" y="86" font-family="'Bricolage Grotesque', Georgia, serif" font-size="78" font-weight="700" letter-spacing="-1.5" fill="#1c1917">Pharma<tspan fill="#b44b2a">Trace</tspan></text>

    <!-- Subtitle / Institutional Line -->
    <text x="4" y="126" font-family="'Bricolage Grotesque', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#8c3319" text-transform="uppercase">Community Care &amp; Medicine Verification</text>
  </g>
</svg>